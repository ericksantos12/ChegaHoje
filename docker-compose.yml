services:
  chegahoje_bot:
    build: .
    restart: unless-stopped
    container_name: chegahoje_bot
    environment:
      TZ: "America/Sao_Paulo"
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      DATABASE_URL: ${DATABASE_URL}
      DEVELOPER_CHAT_ID: ${DEVELOPER_CHAT_ID}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: chegahoje_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: "America/Sao_Paulo"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - chegahoje_postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: unless-stopped
    container_name: chegahoje_adminer
    ports:
      - "5460:8080"
    depends_on:
      - db

volumes:
  chegahoje_postgres_data:
